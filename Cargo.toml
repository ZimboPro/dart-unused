[package]
name = "dart-unused"
version = "0.1.1"
edition = "2024"
rust-version = "1.92.0"
repository = "https://github.com/ZimboPro/dart-unused"
authors = ["ZimboPro"]

[package.metadata.wix]
upgrade-guid = "34B86871-B328-4DBE-AB4A-AFA960CC15C1"
path-guid = "E1D1F4A0-D2A0-4133-BB41-BCB0F62CE87C"
license = false
eula = false

[dependencies]
aho-corasick = { version = "1.1.4", optional = true }
anyhow = "1.0.100"
clap = { version = "4.5.57", features = ["derive"] }
glob = "0.3.3"
hashbrown = { version = "0.16.1", features = ["rayon"] }
log = "0.4.29"
memchr = "2.7.6"
# memmap2 = "0.9.9"
nom = "8.0.0"
papaya = "0.2.3"
path-dedot = "3.1.1"
presence-rs = { version = "0.2.0", features = ["serde"] }
rayon = "1.11.0"
regex = { version = "1.12.2", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml2 = "0.1.3"
simplelog = "0.12.2"
walkdir = "2.5.0"

[features]
default = []
example = ["dep:aho-corasick", "dep:regex"]

[profile.release]
debug = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
debug = false

[[example]]
name = "comparison"
required-features = ["example"]
